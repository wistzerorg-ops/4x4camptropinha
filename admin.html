<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Times Inscritos</title>
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #111;
            --neon-purple: #b026ff;
            --text-main: #fff;
            --neon-shadow: 0 0 10px var(--neon-purple), inset 0 0 10px var(--neon-purple);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 2px solid var(--neon-purple); padding-bottom: 20px; }
        .header h1 { color: var(--text-main); text-transform: uppercase; text-shadow: 0 0 10px var(--neon-purple); }
        
        .btn-clear { background: transparent; color: #ff2a2a; border: 1px solid #ff2a2a; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; box-shadow: 0 0 5px #ff2a2a; }
        .btn-clear:hover { background: #ff2a2a; color: #fff; box-shadow: 0 0 20px #ff2a2a; }
        .btn-clear:active { transform: scale(0.95); }

        /* Grid em Caixinhas (Cards) */
        .cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .team-card { background: var(--surface-color); border: 2px solid var(--neon-purple); border-radius: 15px; padding: 25px; box-shadow: var(--neon-shadow); transition: transform 0.3s, box-shadow 0.3s; position: relative; overflow: hidden; }
        .team-card:hover { transform: translateY(-5px); box-shadow: 0 0 25px var(--neon-purple), inset 0 0 15px var(--neon-purple); }
        
        /* Detalhe estético no card */
        .team-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(176, 38, 255, 0.1), transparent); transform: rotate(45deg); pointer-events: none; }

        .team-card h2 { color: var(--neon-purple); font-size: 1.5rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px dashed rgba(176,38,255,0.5); padding-bottom: 10px; }
        .info-line { display: flex; align-items: center; margin-bottom: 10px; font-size: 1rem; }
        .info-line strong { color: var(--neon-purple); margin-right: 8px; width: 80px; }
        
        .empty { grid-column: 1 / -1; text-align: center; color: #555; font-size: 1.2rem; margin-top: 50px; font-style: italic; }

    </style>
</head>
<body>

    <div class="header">
        <h1>Painel Admin - Lines Inscritas</h1>
        <button class="btn-clear" onclick="clearData()">Zerar Inscrições</button>
    </div>

    <div class="cards-container" id="cardsContainer">
        <!-- Renderizado pelo JS -->
    </div>

    <script>
        function loadTeams() {
            const container = document.getElementById('cardsContainer');
            const teams = JSON.parse(localStorage.getItem('ff_teams_neon')) || [];
            
            container.innerHTML = '';

            if (teams.length === 0) {
                container.innerHTML = '<div class="empty">Nenhum time inscrito para amassar ainda.</div>';
                return;
            }

            teams.forEach(team => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <h2>${team.name}</h2>
                    <div class="info-line"><strong>WhatsApp:</strong> ${team.phone}</div>
                    <div class="info-line"><strong>P1 (Cap):</strong> ${team.p1}</div>
                    <div class="info-line"><strong>P2:</strong> ${team.p2}</div>
                    <div class="info-line"><strong>P3:</strong> ${team.p3}</div>
                    <div class="info-line"><strong>P4:</strong> ${team.p4}</div>
                `;
                container.appendChild(card);
            });
        }

        function clearData() {
            if (confirm("ATENÇÃO: Apagar todas as inscrições?")) {
                localStorage.removeItem('ff_teams_neon');
                loadTeams();
            }
        }

        loadTeams();
    </script>
</body>
</html>
