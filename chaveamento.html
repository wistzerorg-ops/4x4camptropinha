<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin & Chaveamento - 4x4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root { 
            --primary: #b026ff; 
            --primary-glow: rgba(176, 38, 255, 0.6);
            --bg: #050505; 
            --surface: #111111; 
            --text: #ffffff; 
            --danger: #ff2626;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Montserrat', sans-serif; 
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
            overflow-x: hidden;
        }
        
        h1, h2 { 
            color: var(--text); 
            text-transform: uppercase; 
            text-align: center; 
            font-weight: 900;
            text-shadow: 0 0 15px var(--primary-glow);
            margin-bottom: 20px;
        }

        /* --- SISTEMA DE ABAS --- */
        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--surface);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.2);
        }

        .tab-btn {
            background: transparent;
            color: var(--text);
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            color: #fff;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 1400px;
            animation: fadeIn 0.5s ease forwards;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- BOTÕES GERAIS --- */
        .btn { 
            background: transparent; 
            color: var(--primary); 
            border: 2px solid var(--primary); 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1rem; 
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px transparent;
            margin-bottom: 20px;
        }

        .btn:hover { 
            background: var(--primary); 
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.05);
        }

        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: var(--danger);
            box-shadow: 0 0 20px rgba(255, 38, 38, 0.6);
        }

        /* --- ADMIN: CAIXINHAS NEON --- */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .admin-card {
            background: var(--surface);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .admin-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .admin-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), 0 0 20px var(--primary-glow);
        }

        .admin-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .admin-card p {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ccc;
        }
        .admin-card p strong { color: #fff; }

        /* --- CHAVEAMENTO --- */
        .bracket-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: flex-start;
            gap: 60px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 30px;
            padding-top: 10px;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 30px;
            min-width: 250px;
        }

        .round h3 {
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .matchup { 
            display: flex; 
            flex-direction: column; 
            background: var(--surface); 
            border-radius: 12px; 
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 10px rgba(176, 38, 255, 0.05); 
            position: relative;
            transition: 0.3s;
            animation: slideIn 0.5s ease forwards;
        }

        .matchup:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(0,0,0,0.9), 0 0 20px var(--primary-glow);
        }

        .round:not(:last-child) .matchup::after {
            content: ''; position: absolute; right: -30px; top: 50%;
            width: 30px; height: 2px; background: #333; z-index: -1;
        }

        .team { 
            padding: 15px; font-size: 1.1rem; font-weight: 700; 
            text-align: center; text-transform: uppercase;
        }
        .team:first-child { border-bottom: 1px solid #222; }

        .vs {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg); color: var(--primary);
            font-size: 0.8rem; font-weight: 900;
            padding: 4px 8px; border-radius: 5px; border: 1px solid #222;
        }
        
        .warning { 
            color: var(--primary); font-weight: bold; 
            text-align: center; font-size: 1.2rem; margin-top: 20px; 
        }

        /* --- ANIMAÇÕES E SCROLLBAR --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    </style>
</head>
<body>

    <h1>Painel de Controle 4x4</h1>

    <!-- ABAS DE NAVEGAÇÃO -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('admin')">Admin (Inscritos)</button>
        <button class="tab-btn" onclick="switchTab('bracket')">Chaveamento</button>
    </div>

    <!-- CONTEÚDO DA ABA ADMIN -->
    <div id="tab-admin" class="tab-content active">
        <h2>Times Inscritos</h2>
        <button class="btn btn-danger" onclick="clearData()">Zerar Todas as Inscrições</button>
        <div class="admin-grid" id="adminGrid">
            <!-- Caixinhas injetadas pelo JS -->
        </div>
    </div>

    <!-- CONTEÚDO DA ABA CHAVEAMENTO -->
    <div id="tab-bracket" class="tab-content">
        <h2>Gerador de Chaves</h2>
        <button class="btn" onclick="generateDynamicBracket()">Gerar / Sortear Chaves</button>
        <div class="bracket-wrapper" id="bracketContainer">
            <div class="warning">Clique no botão acima para sortear as chaves.</div>
        </div>
    </div>

    <script>
        // Lógica de Troca de Abas
        function switchTab(tabName) {
            // Remove classe 'active' de todos os botões e conteúdos
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // Adiciona classe 'active' na aba selecionada
            if(tabName === 'admin') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-admin').classList.add('active');
                loadAdminCards(); // Recarrega os cards ao abrir a aba
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-bracket').classList.add('active');
            }
        }

        // --- LÓGICA DO ADMIN (CAIXINHAS) ---
        function loadAdminCards() {
            const grid = document.getElementById('adminGrid');
            const teams = JSON.parse(localStorage.getItem('ff_teams')) || [];
            
            grid.innerHTML = '';

            if (teams.length === 0) {
                grid.innerHTML = '<div class="warning" style="grid-column: 1 / -1;">Nenhum time inscrito ainda.</div>';
                return;
            }

            teams.forEach(team => {
                const card = document.createElement('div');
                card.className = 'admin-card';
                card.innerHTML = `
                    <h3>${team.name}</h3>
                    <p><strong>WhatsApp:</strong> ${team.phone}</p>
                    <p><strong>P1 (Rep):</strong> ${team.p1}</p>
                    <p><strong>P2:</strong> ${team.p2}</p>
                    <p><strong>P3:</strong> ${team.p3}</p>
                    <p><strong>P4:</strong> ${team.p4}</p>
                `;
                grid.appendChild(card);
            });
        }

        function clearData() {
            if (confirm("ATENÇÃO: Deseja apagar permanentemente todas as inscrições?")) {
                localStorage.removeItem('ff_teams');
                loadAdminCards();
                document.getElementById('bracketContainer').innerHTML = '<div class="warning">Chaveamento resetado. Inscreva novos times.</div>';
            }
        }

        // --- LÓGICA DO CHAVEAMENTO ---
        function shuffleArray(array) {
            let shuffled = array.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function generateDynamicBracket() {
            const container = document.getElementById('bracketContainer');
            let registeredTeams = JSON.parse(localStorage.getItem('ff_teams')) || [];
            
            container.innerHTML = '';

            if (registeredTeams.length < 2) {
                container.innerHTML = '<div class="warning">Mínimo de 2 times necessários para gerar o chaveamento!</div>';
                return;
            }

            // Acha a potência de 2 mais próxima (2, 4, 8, 16, 32...)
            let powerOf2 = 2;
            while (powerOf2 < registeredTeams.length) {
                powerOf2 *= 2;
            }

            let teams = shuffleArray(registeredTeams);

            // Preenche buracos com W.O
            while (teams.length < powerOf2) {
                teams.push({ name: 'W.O (BYE)' });
            }

            let roundsData = [];
            let currentRoundTeams = teams;

            // Cria a árvore mata-mata
            while (currentRoundTeams.length >= 2) {
                let matches = [];
                let nextRoundPlaceholders = [];

                for (let i = 0; i < currentRoundTeams.length; i += 2) {
                    matches.push({
                        t1: currentRoundTeams[i].name,
                        t2: currentRoundTeams[i+1].name
                    });
                    nextRoundPlaceholders.push({ name: 'Vencedor' });
                }
                roundsData.push(matches);
                currentRoundTeams = nextRoundPlaceholders;
            }

            const totalRounds = roundsData.length;
            const roundNames = [];
            
            // Define nomes das fases baseado no tamanho
            for (let i = 0; i < totalRounds; i++) {
                let matchCount = roundsData[i].length;
                if (matchCount === 1) roundNames.push("Grande Final");
                else if (matchCount === 2) roundNames.push("Semifinal");
                else if (matchCount === 4) roundNames.push("Quartas de Final");
                else if (matchCount === 8) roundNames.push("Oitavas de Final");
                else if (matchCount === 16) roundNames.push("16 Avos");
                else roundNames.push(`Rodada de ${matchCount * 2}`);
            }

            // Injeta na tela
            roundsData.forEach((round, roundIndex) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                
                const title = document.createElement('h3');
                title.innerText = roundNames[roundIndex];
                roundDiv.appendChild(title);

                round.forEach((match, matchIndex) => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'matchup';
                    matchDiv.style.animationDelay = `${(roundIndex * 0.15) + (matchIndex * 0.05)}s`;

                    let t1Style = (match.t1.includes('W.O') || match.t1 === 'Vencedor') ? 'color:#666; font-weight:normal;' : 'color:#fff;';
                    let t2Style = (match.t2.includes('W.O') || match.t2 === 'Vencedor') ? 'color:#666; font-weight:normal;' : 'color:#fff;';

                    matchDiv.innerHTML = `
                        <div class="team" style="${t1Style}">${match.t1}</div>
                        <div class="vs">VS</div>
                        <div class="team" style="${t2Style}">${match.t2}</div>
                    `;
                    roundDiv.appendChild(matchDiv);
                });
                container.appendChild(roundDiv);
            });
        }

        // Carrega o admin inicial caso haja dados no localStorage
        loadAdminCards();
    </script>
</body>
</html>
