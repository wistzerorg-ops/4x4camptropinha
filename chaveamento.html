<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaveamento Dinâmico 4x4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        :root { 
            --primary: #b026ff; 
            --primary-glow: rgba(176, 38, 255, 0.6);
            --bg: #050505; 
            --surface: #111111; 
            --text: #ffffff; 
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Montserrat', sans-serif; 
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px;
            overflow-x: auto;
        }
        
        h1 { 
            color: var(--text); 
            margin-bottom: 40px; 
            text-transform: uppercase; 
            text-align: center; 
            font-weight: 900;
            text-shadow: 0 0 15px var(--primary-glow);
        }
        
        .controls { 
            margin-bottom: 40px; 
            display: flex;
            gap: 15px;
        }

        .btn { 
            background: transparent; 
            color: var(--primary); 
            border: 2px solid var(--primary); 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1.1rem; 
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px transparent;
        }

        .btn:hover { 
            background: var(--primary); 
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.05);
        }
        
        /* Container Principal do Chaveamento */
        .bracket-wrapper {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            gap: 60px;
            width: 100%;
            max-width: 1400px;
            overflow-x: auto;
            padding-bottom: 30px;
            animation: fadeIn 1s ease forwards;
        }

        /* Cada Coluna (Rodada) */
        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 30px;
            min-width: 250px;
        }

        .round h3 {
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* Cartão de Confronto */
        .matchup { 
            display: flex; 
            flex-direction: column; 
            background: var(--surface); 
            border-radius: 12px; 
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 15px rgba(176, 38, 255, 0.1); 
            overflow: hidden;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        .matchup:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(0,0,0,0.9), 0 0 25px var(--primary-glow);
        }

        /* Efeito visual nas chaves (Conectores virtuais) */
        .round:not(:last-child) .matchup::after {
            content: '';
            position: absolute;
            right: -30px;
            top: 50%;
            width: 30px;
            height: 2px;
            background: #333;
            z-index: -1;
        }

        .team { 
            padding: 15px; 
            font-size: 1.1rem; 
            font-weight: 700; 
            text-align: center;
            text-transform: uppercase;
        }

        .team:first-child { border-bottom: 1px solid #222; }

        .vs {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg);
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 900;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #222;
        }
        
        .warning { 
            color: var(--primary); 
            font-weight: bold; 
            text-align: center; 
            font-size: 1.2rem;
            margin-top: 20px; 
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Scrollbar customizada para o overflow */
        ::-webkit-scrollbar { height: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

    <h1>Chaveamento Oficial</h1>
    
    <div class="controls">
        <button class="btn" onclick="generateDynamicBracket()">Gerar Chaveamento</button>
    </div>

    <div class="bracket-wrapper" id="bracketContainer">
        <div class="warning">Clique em "Gerar Chaveamento" para sortear as chaves baseadas nos inscritos.</div>
    </div>

    <script>
        // Função para embaralhar os times
        function shuffleArray(array) {
            let shuffled = array.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function generateDynamicBracket() {
            const container = document.getElementById('bracketContainer');
            let registeredTeams = JSON.parse(localStorage.getItem('ff_teams')) || [];
            
            container.innerHTML = '';

            if (registeredTeams.length < 2) {
                container.innerHTML = '<div class="warning">Inscreva pelo menos 2 times para gerar o chaveamento!</div>';
                return;
            }

            // Descobre qual é a potência de 2 mais próxima (2, 4, 8, 16, 32...)
            let powerOf2 = 2;
            while (powerOf2 < registeredTeams.length) {
                powerOf2 *= 2;
            }

            // Embaralha os times inscritos
            let teams = shuffleArray(registeredTeams);

            // Preenche com 'W.O' (Aguardando) caso não seja uma potência exata de 2 (ex: tem 6 times, preenche 2 com W.O para formar 8)
            while (teams.length < powerOf2) {
                teams.push({ name: 'W.O' });
            }

            // Variável para armazenar a estrutura de cada rodada
            let roundsData = [];
            let currentRoundTeams = teams;

            // Simula a progressão das chaves até a final
            while (currentRoundTeams.length >= 2) {
                let matches = [];
                let nextRoundPlaceholders = [];

                for (let i = 0; i < currentRoundTeams.length; i += 2) {
                    matches.push({
                        t1: currentRoundTeams[i].name,
                        t2: currentRoundTeams[i+1].name
                    });
                    // O vencedor avança para a próxima rodada (Usamos "Vencedor" como placeholder visual nas próximas colunas)
                    nextRoundPlaceholders.push({ name: 'Vencedor' });
                }

                roundsData.push(matches);
                currentRoundTeams = nextRoundPlaceholders;
            }

            // Define os nomes corretos para as rodadas geradas
            const totalRounds = roundsData.length;
            const roundNames = [];
            
            for (let i = 0; i < totalRounds; i++) {
                let matchCount = roundsData[i].length;
                if (matchCount === 1) roundNames.push("Grande Final");
                else if (matchCount === 2) roundNames.push("Semifinal");
                else if (matchCount === 4) roundNames.push("Quartas de Final");
                else if (matchCount === 8) roundNames.push("Oitavas de Final");
                else if (matchCount === 16) roundNames.push("16 Avos");
                else roundNames.push(`Rodada de ${matchCount * 2}`);
            }

            // Renderiza o HTML dinamicamente
            roundsData.forEach((round, roundIndex) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                
                const title = document.createElement('h3');
                title.innerText = roundNames[roundIndex];
                roundDiv.appendChild(title);

                round.forEach((match, matchIndex) => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'matchup';
                    
                    // Adiciona delay na animação para efeito cascata
                    matchDiv.style.animationDelay = `${(roundIndex * 0.2) + (matchIndex * 0.1)}s`;

                    matchDiv.innerHTML = `
                        <div class="team" style="color: ${match.t1 === 'W.O' || match.t1 === 'Vencedor' ? '#555' : '#fff'}">${match.t1}</div>
                        <div class="vs">VS</div>
                        <div class="team" style="color: ${match.t2 === 'W.O' || match.t2 === 'Vencedor' ? '#555' : '#fff'}">${match.t2}</div>
                    `;
                    roundDiv.appendChild(matchDiv);
                });

                container.appendChild(roundDiv);
            });
        }
    </script>
</body>
</html>
